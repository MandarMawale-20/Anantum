<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anantum V2</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage">
      <section
        class="siri-pill is-idle"
        id="assistantWidget"
        data-tauri-drag-region
        aria-live="polite"
        aria-label="Floating assistant"
      >
        <div class="pill-glow" aria-hidden="true"></div>
        <div class="pill-rim" aria-hidden="true"></div>
        <div class="pill-clip" aria-hidden="true"><div class="pill-sheen"></div></div>

        <button type="button" class="orb" id="orbShell" aria-label="Toggle assistant">
          <span class="orb-static" aria-hidden="true"></span>
          <span class="orb-wave" id="siri-container" aria-hidden="true"></span>
        </button>

        <p class="pill-text" id="assistantText" data-tauri-drag-region>How can I help?</p>

        <div class="pill-actions">
          <button type="button" class="icon-btn" id="typeBtn" aria-label="Type a request" title="Type a request">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="6" width="20" height="12" rx="2.5"/>
              <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/>
            </svg>
          </button>
          <button type="button" class="icon-btn" id="changeModelBtn" aria-label="Change model" title="Change model">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.74v.23a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.23a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
          <button type="button" class="icon-btn" id="micBtn" aria-label="Talk" title="Talk">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="22"/>
            </svg>
          </button>
        </div>
      </section>

      <section class="below" id="below">
        <div class="bubble" id="bubble">
          <p class="bubble-text" id="bubbleText"></p>
          <p class="bubble-notice" id="bubbleNotice" hidden></p>
        </div>

        <div class="composer" id="composer" hidden>
          <input
            id="composerInput"
            class="composer-input"
            type="text"
            placeholder="Type to Anantum…"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="button" class="icon-btn send" id="composerSend" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5"/>
              <path d="m5 12 7-7 7 7"/>
            </svg>
          </button>
        </div>

        <div class="menu" id="menu" hidden>
          <button type="button" class="icon-btn" id="menuModel" aria-label="Change model" title="Change model">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.74v.23a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.23a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
          <button type="button" class="icon-btn" id="menuRestart" aria-label="Restart backend" title="Restart backend">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/>
              <path d="M21 3v5h-5"/>
              <path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/>
              <path d="M3 21v-5h5"/>
            </svg>
          </button>
          <button type="button" class="icon-btn" id="menuQuit" aria-label="Quit Anantum" title="Quit Anantum">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v9"/>
              <path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>
            </svg>
          </button>
        </div>
      </section>
    </main>

    <script src="./siriwave.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
